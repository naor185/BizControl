workflows:
  bizcontrol-android:
    name: BizControl — Android
    max_build_duration: 60
    # instance_type omitted — let Codemagic pick whatever's available on
    # the current billing plan instead of guessing an exact name that
    # keeps getting rejected.
    environment:
      # Add a "google_play" env-var group here (Settings > Environment
      # variables, with GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in it) once you
      # want this workflow to also auto-upload to Play Console — omitted
      # for now since Codemagic requires a referenced group to actually
      # exist, and this one didn't yet.
      android_signing:
        - bizcontrol_android   # keystore reference configured in Codemagic UI (Team settings > Code signing identities > Android)
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.bizcontrol.app"
    scripts:
      - name: Install npm dependencies
        script: |
          cd web
          npm ci
      - name: Sync native Capacitor project
        script: |
          cd web
          npx cap sync android
      - name: Build signed release AAB
        script: |
          cd web/android
          chmod +x ./gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - web/android/app/build/outputs/**/*.aab
      - web/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ncbilutattoo@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once the google_play group above has real credentials and
      # the app already has at least one manual release in Play Console
      # (Play's API requires that before it will accept automated uploads):
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal   # internal -> alpha -> beta -> production, promote manually at first

  bizcontrol-ios:
    name: BizControl — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: bizcontrol_asc_api_key   # name of the App Store Connect API key integration, added in Codemagic UI (Team settings > Integrations > App Store Connect)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bizcontrol.app
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          cd web
          npm ci
      - name: Sync native Capacitor project
        script: |
          cd web
          npx cap sync ios
      - name: Set up code signing
        script: |
          cd web/ios/App
          xcode-project use-profiles
      - name: Bump build number
        script: |
          # App Store Connect rejects re-uploading the same CFBundleVersion —
          # $BUILD_NUMBER is Codemagic's own per-app, ever-increasing counter,
          # so this is always higher than whatever was uploaded last time,
          # no need to query Apple for the previous value.
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          cd web/ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ncbilutattoo@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Targets the existing Internal Testing group only — internal testers
        # get the build instantly with no Apple review and no Beta App
        # Description requirement (that's only needed for External Testing
        # groups). "NAOR" is the group already set up in App Store Connect >
        # TestFlight > Internal Testing for this app (its badge shows as the
        # 2-letter initials "NA", but the actual group name is "NAOR").
        beta_groups:
          - NAOR
        # Flip to true once you're ready for an actual App Store review —
        # leave false while you're still just getting TestFlight builds out:
        submit_to_app_store: false

  bizfind-android:
    name: BizFind — Android
    max_build_duration: 60
    environment:
      android_signing:
        - bizfind_android   # separate keystore from bizcontrol_android — create it under Code signing identities > Android, its own reference name
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.bizfind.app"
    scripts:
      - name: Install npm dependencies
        script: |
          cd customers
          npm ci
      - name: Sync native Capacitor project
        script: |
          cd customers
          npx cap sync android
      - name: Build signed release AAB
        script: |
          cd customers/android
          chmod +x ./gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - customers/android/app/build/outputs/**/*.aab
      - customers/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ncbilutattoo@gmail.com
        notify:
          success: true
          failure: true

  bizfind-ios:
    name: BizFind — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: bizcontrol_asc_api_key   # same API key integration — it's account-wide, not tied to one app
    environment:
      ios_signing:
        distribution_type: app_store
        # iOS-specific bundle id — com.bizfind.app was already claimed on
        # Apple's side by a different account, so the iOS build uses this
        # instead. Android keeps com.bizfind.app (see PACKAGE_NAME above) —
        # no conflict there, and Capacitor allows the two platforms to use
        # different identifiers for the same app.
        bundle_identifier: com.bizcontrol.bizfind
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          cd customers
          npm ci
      - name: Sync native Capacitor project
        script: |
          cd customers
          npx cap sync ios
      - name: Set up code signing
        script: |
          cd customers/ios/App
          xcode-project use-profiles
      - name: Bump build number
        script: |
          cd customers/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          cd customers/ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - customers/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ncbilutattoo@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # See bizcontrol-ios above — targets Internal Testing only, no Apple
        # review / Beta App Description needed. BizFind is a separate app in
        # App Store Connect with its own internal testing group, already
        # named "Internal" there (not "NAOR" — that's BizControl's group
        # name, confirmed to differ 2026-09-03 after auto-assignment failed
        # here with "Cannot add internal group to a build").
        beta_groups:
          - Internal
        submit_to_app_store: false
